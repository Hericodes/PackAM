# Runs PackAM's runner dispatch pass every 5 minutes (Vercel Hobby only allows a daily Vercel Cron).
# Needs two repository secrets: PACKAM_BASE_URL (e.g. https://packam.example) and CRON_SECRET (the same
# value as CRON_SECRET in Vercel). The endpoint is idempotent and bounded, so retries and overlaps are safe.
name: Runner dispatch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: runner-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the dispatch endpoint
        env:
          BASE_URL: ${{ secrets.PACKAM_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "PACKAM_BASE_URL and CRON_SECRET repository secrets are required." >&2
            exit 1
          fi
          status=$(curl -sS -o response.json -w "%{http_code}" --max-time 90 --retry 2 --retry-delay 10 \
            -X POST -H "Authorization: Bearer ${CRON_SECRET}" "${BASE_URL%/}/api/internal/fulfilment/run-due")
          echo "HTTP ${status}"
          cat response.json; echo
          [ "$status" = "200" ]
