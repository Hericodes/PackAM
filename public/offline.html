<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fffdf7">
  <meta name="robots" content="noindex">
  <title>You're offline | PackAM</title>
  <style>
    :root { color-scheme: only light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px calc(24px + env(safe-area-inset-bottom)); background: #fffdf7; color: #080808; font-family: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { width: 100%; max-width: 380px; text-align: center; }
    img { width: 132px; height: auto; }
    h1 { margin: 16px 0 8px; font-size: 1.5rem; font-weight: 900; letter-spacing: -0.01em; }
    p { margin: 0; color: rgba(8, 8, 8, 0.68); line-height: 1.55; }
    .card { margin-top: 20px; padding: 16px; border-radius: 18px; background: #fff; border: 1px solid #e8e8e8; text-align: left; font-size: 0.9rem; }
    .card p + p { margin-top: 8px; }
    button { margin-top: 20px; width: 100%; min-height: 48px; border: 0; border-radius: 999px; background: #080808; color: #fff; font: inherit; font-weight: 900; cursor: pointer; }
    button:focus-visible { outline: 2px solid #080808; outline-offset: 3px; }
    .status { margin-top: 12px; font-size: 0.85rem; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <img src="/packam-logo.png" alt="PackAM" width="132" height="108">
    <h1>You're offline</h1>
    <p>PackAM needs the internet to show live prices, your cart and your orders.</p>
    <div class="card">
      <p><strong>Nothing is lost.</strong> Your cart and orders are saved to your account.</p>
      <p>If you were paying, don't pay again. Open your orders when you're back online to see the confirmed status.</p>
    </div>
    <button type="button" id="retry">Try again</button>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>
  <script>
    (function () {
      var status = document.getElementById("status");
      function retry() { status.textContent = "Reconnecting…"; window.location.reload(); }
      document.getElementById("retry").addEventListener("click", retry);
      // Back online: load the page the student was trying to open.
      window.addEventListener("online", retry);
    })();
  </script>
</body>
</html>
